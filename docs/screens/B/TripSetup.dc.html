<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>B 여행 정보 입력</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Gowun+Dodum&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B23A22}a:hover{color:#3A2A20}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Gowun Dodum', sans-serif; color: #3A2A20; background: #FFF7EC; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 8px; padding: 16px 16px 8px">
    <a href="B_Main.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 3px 0 #F0DCC4; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3A2A20" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="flex: 1; height: 10px; border-radius: 5px; background: #F3E3D1; overflow: hidden">
      <div style="width: 50%; height: 10px; border-radius: 5px; background: #D2492F"></div>
    </div>
    <div style="font-size: 13px; color: #7A6352; padding-right: 4px">1/2</div>
  </header>
  <main style="flex: 1; overflow-y: auto; padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 16px">
    <h1 style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 26px; line-height: 1.3">몇 가지만 알려주세요!</h1>

    <section style="display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 4px 0 #F0DCC4">
      <h2 style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 18px">누구랑 가요?</h2>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{companions}}" as="c" hint-placeholder-count="4">
          <button onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
        </sc-for>
      </div>
      <sc-if value="{{withKids}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 4px">
          <span style="font-size: 14px; color: #7A6352">아이 나이</span>
          <span style="height: 40px; padding: 0 14px; border-radius: 20px; background: #FFC93C; display: flex; align-items: center; font-size: 15px; font-weight: 700">7살</span>
          <span style="height: 40px; padding: 0 14px; border-radius: 20px; background: #FFC93C; display: flex; align-items: center; font-size: 15px; font-weight: 700">3살</span>
          <button aria-label="아이 추가" style="width: 40px; height: 40px; border-radius: 20px; border: 2px dashed #D9BFA3; background: transparent; font: inherit; font-size: 20px; color: #7A6352; cursor: pointer">+</button>
        </div>
      </sc-if>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 4px 0 #F0DCC4">
      <h2 style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 18px">제주 어느 쪽이에요?</h2>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <sc-for list="{{regions}}" as="r" hint-placeholder-count="4">
          <button onClick="{{r.pick}}" style="{{r.style}}">{{r.label}}</button>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 4px 0 #F0DCC4">
      <h2 style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 18px">언제, 몇 시 비행기예요?</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <label style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 16px; background: #FFF7EC; font-size: 12px; color: #7A6352">가는 날 · 도착
          <input type="text" value="11.6(금) 10:30" style="border: none; background: transparent; padding: 0; font: inherit; font-size: 16px; font-weight: 700; color: #3A2A20">
        </label>
        <label style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 16px; background: #FFF7EC; font-size: 12px; color: #7A6352">오는 날 · 출발
          <input type="text" value="11.8(일) 18:40" style="border: none; background: transparent; padding: 0; font: inherit; font-size: 16px; font-weight: 700; color: #3A2A20">
        </label>
      </div>
      <label style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 16px; background: #FFF7EC; font-size: 12px; color: #7A6352">숙소
        <input type="text" placeholder="숙소 이름이나 주소" style="border: none; background: transparent; padding: 0; font: inherit; font-size: 16px; color: #3A2A20">
      </label>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 18px">어떻게 시작할까요?</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{starts}}" as="s" hint-placeholder-count="3">
          <button onClick="{{s.pick}}" style="{{s.style}}">
            <span style="{{s.blob}}"></span>
            <span style="font-family: 'Jua', sans-serif; font-size: 15px">{{s.title}}</span>
            <span style="font-size: 12px; color: #7A6352; line-height: 1.35">{{s.desc}}</span>
          </button>
        </sc-for>
      </div>
    </section>
  </main>
  <div style="padding: 12px 20px 24px">
    <a href="{{nextHref}}" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 28px; background: #D2492F; color: #FFFFFF; font-family: 'Jua', sans-serif; font-size: 18px; text-decoration: none; box-shadow: 0 4px 0 #9E3520">{{nextLabel}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { region: 'west', companion: 'kids', start: 'self' };
}
pill(on) {
return 'height: 42px; padding: 0 12px; border-radius: 21px; font: inherit; font-size: 14px; cursor: pointer; ' +
(on ? 'border: 2px solid #3A2A20; background: #3A2A20; color: #FFFFFF; font-weight: 700' : 'border: 2px solid #F0DCC4; background: #FFFFFF; color: #3A2A20');
}
renderVals() {
const s = this.state;
const regions = [['west', '서쪽 (애월·협재)'], ['east', '동쪽'], ['south', '서귀포'], ['city', '제주시']]
.map((r) => ({ label: r[1], style: this.pill(s.region === r[0]), pick: () => this.setState({ region: r[0] }) }));
const companions = [['kids', '아이들과'], ['parents', '부모님과'], ['couple', '연인과'], ['friends', '친구끼리']]
.map((c) => ({ label: c[1], style: this.pill(s.companion === c[0]) + '; padding: 0', pick: () => this.setState({ companion: c[0] }) }));
const starts = [
{ id: 'self', title: '직접 짜기', desc: '빈 칸부터', c: '#BFE6D5' },
{ id: 'ai', title: 'AI 초안', desc: '먼저 받아보기', c: '#FFC93C' },
{ id: 'browse', title: '따라가기', desc: '남의 루트 복사', c: '#FFC6B8' }
].map((x) => {
const on = s.start === x.id;
return { ...x,
style: 'display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px 12px; border-radius: 22px; font: inherit; color: #3A2A20; cursor: pointer; text-align: left; background: #FFFFFF; ' +
(on ? 'border: 2px solid #3A2A20' : 'border: 2px solid transparent; box-shadow: 0 4px 0 #F0DCC4'),
blob: 'width: 30px; height: 30px; border-radius: 10px 15px 12px 15px; background: ' + x.c,
pick: () => this.setState({ start: x.id }) };
});
const next = { self: ['B_SlotEditor.dc.html', '좋아요, 시작할게요'], ai: ['B_SlotEditor.dc.html', 'AI 초안 받아보기'], browse: ['B_RouteDetail.dc.html', '인기 루트 보러 가기'] }[s.start];
return { regions, companions, starts, withKids: s.companion === 'kids', nextHref: next[0], nextLabel: next[1] };
}
}
</script>
</body>
</html>
