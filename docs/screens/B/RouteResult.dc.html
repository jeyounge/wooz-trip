<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>B 루트 결과</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Gowun+Dodum&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B23A22}a:hover{color:#3A2A20}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Gowun Dodum', sans-serif; color: #3A2A20; background: #FFF7EC; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 10px; padding: 16px 16px 8px">
    <a href="B_SlotEditor.dc.html" aria-label="편집으로 돌아가기" style="flex: none; width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 3px 0 #F0DCC4; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3A2A20" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="flex: 1">
      <div style="font-family: 'Jua', sans-serif; font-size: 20px">짜잔, 동선 완성!</div>
      <div style="font-size: 13px; color: #1E5A45">쉬는 날·영업시간 겹치는 곳 없어요</div>
    </div>
  </header>
  <div style="margin: 0 20px; border-radius: 28px; overflow: hidden; background: #CFEDE2; box-shadow: 0 4px 0 #F0DCC4; position: relative; flex: none; height: 220px">
    <svg width="350" height="220" viewBox="0 0 350 220" role="img" aria-label="일자별 동선 지도 (지도 영역 자리표시)">
      <path d="M-10 40 C 50 20, 110 50, 170 34 S 280 14, 360 46 L 360 230 L -10 230 Z" fill="#FFF3DD"></path>
      <path d="M-10 40 C 50 20, 110 50, 170 34 S 280 14, 360 46" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"></path>
      <polyline points="300,190 230,120 165,86 110,98 82,140" fill="none" stroke="#D2492F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 10" opacity="{{op1}}"></polyline>
      <polyline points="82,140 64,92 128,72 192,114 238,164" fill="none" stroke="#2E8A6A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 10" opacity="{{op2}}"></polyline>
      <polyline points="82,140 148,156 228,176 300,190" fill="none" stroke="#3B5BA5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 10" opacity="{{op3}}"></polyline>
      <g opacity="{{op1}}">
        <circle cx="300" cy="190" r="14" fill="#D2492F" stroke="#FFFFFF" stroke-width="3"></circle><text x="300" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
        <circle cx="230" cy="120" r="14" fill="#D2492F" stroke="#FFFFFF" stroke-width="3"></circle><text x="230" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
        <circle cx="165" cy="86" r="14" fill="#D2492F" stroke="#FFFFFF" stroke-width="3"></circle><text x="165" y="91" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
        <circle cx="110" cy="98" r="14" fill="#D2492F" stroke="#FFFFFF" stroke-width="3"></circle><text x="110" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
      </g>
      <circle cx="82" cy="140" r="16" fill="#FFC93C" stroke="#FFFFFF" stroke-width="3"></circle>
      <path d="M75 144 l7 -7 l7 7 v4 h-14 z" fill="#3A2A20"></path>
    </svg>
  </div>
  <nav aria-label="일자" style="display: flex; gap: 8px; padding: 14px 20px 8px">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="3">
      <button onClick="{{d.pick}}" style="{{d.style}}"><span style="{{d.dot}}"></span>{{d.label}}</button>
    </sc-for>
  </nav>
  <div style="flex: 1; overflow-y: auto; padding: 4px 20px 12px; display: flex; flex-direction: column; gap: 4px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
      <sc-if value="{{it.isTravel}}" hint-placeholder-val="{{ false }}">
        <div style="padding: 2px 0 2px 56px; font-size: 12px; color: #7A6352">{{it.text}}</div>
      </sc-if>
      <sc-if value="{{it.isStop}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 3px 0 #F0DCC4">
          <div style="{{it.num}}">{{it.n}}</div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <div style="display: flex; gap: 8px; align-items: baseline">
              <span style="font-size: 13px; font-weight: 700; color: #7A6352">{{it.time}}</span>
              <span style="font-family: 'Jua', sans-serif; font-size: 16px">{{it.name}}</span>
            </div>
            <sc-if value="{{it.memo}}" hint-placeholder-val="{{ false }}">
              <div style="font-size: 12px; color: #9E3520">챙길 것 · {{it.memo}}</div>
            </sc-if>
          </div>
          <button aria-label="순서 바꾸기" style="flex: none; width: 36px; height: 36px; border: none; border-radius: 12px; background: #FFF7EC; display: flex; align-items: center; justify-content: center; cursor: grab">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7A6352" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"></path></svg>
          </button>
        </div>
      </sc-if>
    </sc-for>
  </div>
  <div style="display: flex; gap: 8px; padding: 10px 20px 24px">
    <button aria-label="저장" style="flex: none; width: 56px; height: 56px; border-radius: 28px; border: 2px solid #F0DCC4; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3A2A20" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>
    </button>
    <button style="flex: 1; height: 56px; border-radius: 28px; border: none; background: #FFC93C; font-family: 'Jua', sans-serif; font-size: 16px; color: #3A2A20; cursor: pointer">가족 단톡에 공유</button>
    <a href="B_RouteDetail.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 28px; background: #D2492F; color: #FFFFFF; font-family: 'Jua', sans-serif; font-size: 16px; text-decoration: none; box-shadow: 0 4px 0 #9E3520">자랑하기</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { day: 0 };
}
renderVals() {
const colors = ['#D2492F', '#2E8A6A', '#3B5BA5'];
const d = this.state.day;
const S = (time, name, memo) => ({ isStop: true, time, name, memo: memo || '' });
const T = (text) => ({ isTravel: true, text });
const plans = [
[S('10:30', '제주공항'), T('차로 45분 · 아이들 낮잠'), S('12:00', '[식당명] 애월'), T('차로 15분'), S('13:30', '협재해수욕장', '모래놀이 장난감, 여벌 옷'), T('차로 8분'), S('16:00', '[카페명] 한림'), T('차로 4분'), S('18:00', '[식당명 A] 한림')],
[S('10:00', '[볼거리] 한림'), T('차로 20분'), S('12:30', '[식당명] 귀덕'), T('차로 25분 · 낮잠'), S('14:30', '[실내 놀이] 제주시', '비 오면 여기로')],
[S('10:00', '[볼거리] 애월'), T('차로 10분'), S('12:00', '[식당명] 애월'), T('차로 40분'), S('16:40', '제주공항', '렌터카 반납')]
];
let n = 0;
const items = plans[d].map((it) => it.isStop ? ({ ...it, n: ++n,
num: 'flex: none; width: 36px; height: 36px; border-radius: 12px 18px 14px 18px; background: ' + colors[d] + '; color: #FFFFFF; font-family: \'Jua\', sans-serif; font-size: 17px; display: flex; align-items: center; justify-content: center' }) : it);
const days = ['첫째 날', '둘째 날', '셋째 날'].map((label, i) => ({ label,
style: 'flex: 1; height: 42px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 21px; font-family: \'Jua\', sans-serif; font-size: 14px; cursor: pointer; ' +
(d === i ? 'border: none; background: #3A2A20; color: #FFFFFF' : 'border: 2px solid #F0DCC4; background: #FFFFFF; color: #3A2A20'),
dot: 'width: 10px; height: 10px; border-radius: 5px; background: ' + colors[i],
pick: () => this.setState({ day: i }) }));
const op = (i) => (d === i ? '1' : '0.2');
return { days, items, op1: op(0), op2: op(1), op3: op(2) };
}
}
</script>
</body>
</html>
