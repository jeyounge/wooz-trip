<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>C 공개 루트 상세</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8F25A}a:hover{color:#EEF2F3}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Gothic A1', sans-serif; color: #EEF2F3; background: #0F1417; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; padding: 16px 12px 4px">
    <a href="C_Main.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EEF2F3" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #9AA8B0">ROUTE W-03</span>
    <button aria-label="링크 공유" style="margin-left: auto; width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EEF2F3" stroke-width="2" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 13v7h14v-7"></path></svg>
    </button>
    <button aria-label="저장" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EEF2F3" stroke-width="2" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>
    </button>
  </header>
  <main style="flex: 1; overflow-y: auto; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 20px">
    <section style="display: flex; flex-direction: column; gap: 12px">
      <h1 style="margin: 0; font-size: 28px; line-height: 1.22; font-weight: 800; letter-spacing: -0.03em">제주 서쪽 2박 3일,<br>해변 모래놀이 코스</h1>
      <div style="font-size: 13px; color: #9AA8B0">by [작성자 닉네임] · 아이 2명 (5Y, 2Y) · 2026.08</div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <span style="font-size: 11px; padding: 3px 7px; border-radius: 4px; border: 1px solid #3A4650; color: #CBD5DA">아기의자 식당</span>
        <span style="font-size: 11px; padding: 3px 7px; border-radius: 4px; border: 1px solid #3A4650; color: #CBD5DA">이동 중 낮잠</span>
        <span style="font-size: 11px; padding: 3px 7px; border-radius: 4px; border: 1px solid #3A4650; color: #CBD5DA">발 씻는 곳</span>
      </div>
    </section>
    <section aria-label="루트 요약" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #2A343C; border-bottom: 1px solid #2A343C">
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 0"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #9AA8B0">PLACES</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600">14</span></div>
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 0 12px 12px; border-left: 1px solid #2A343C"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #9AA8B0">DRIVE</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600">3H10M</span></div>
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 0 12px 12px; border-left: 1px solid #2A343C"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #9AA8B0">COPIED</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; color: #C8F25A">[N]</span></div>
    </section>
    <section style="display: flex; flex-direction: column">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; border-bottom: 1px solid #2A343C">
          <button onClick="{{d.toggle}}" aria-expanded="{{d.open}}" style="display: grid; grid-template-columns: 56px minmax(0, 1fr) 20px; gap: 10px; align-items: center; min-height: 56px; padding: 8px 0; border: none; background: transparent; font: inherit; color: #EEF2F3; cursor: pointer; text-align: left">
            <span style="{{d.badge}}">{{d.label}}</span>
            <span style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 14px; font-weight: 600">{{d.area}}</span>
              <span style="font-size: 12px; color: #9AA8B0">{{d.summary}}</span>
            </span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; color: #9AA8B0">{{d.arrow}}</span>
          </button>
          <sc-if value="{{d.open}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 0 14px 66px">
              <sc-for list="{{d.stops}}" as="s" hint-placeholder-count="3">
                <div style="display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 8px; font-size: 13px">
                  <span style="font-family: 'IBM Plex Mono', monospace; color: #9AA8B0">{{s.t}}</span><span>{{s.n}}</span>
                </div>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </section>
    <section style="display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 12px; background: #182026">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #7CC8FF">AUTHOR NOTE</span>
      <span style="font-size: 13px; line-height: 1.6; color: #CBD5DA">[작성자 메모. 예: 협재는 오후 물때가 좋아요. 둘째 날 비 와서 실내 코스로 바꿨어요.]</span>
    </section>
    <button style="align-self: flex-start; height: 40px; padding: 0; border: none; background: transparent; font: inherit; font-size: 13px; color: #9AA8B0; text-decoration: underline; cursor: pointer">장소 정보 제보하기</button>
  </main>
  <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 20px 24px; border-top: 1px solid #2A343C">
    <a href="C_SlotEditor.dc.html" style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 20px; border-radius: 12px; background: #C8F25A; color: #0F1417; font-weight: 800; font-size: 16px; text-decoration: none">
      내 일정으로 복사
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 4px; background: #0F1417; color: #C8F25A">PREMIUM</span>
    </a>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #9AA8B0; text-align: center">RE-CHECKS CLOSURES &amp; DRIVE TIMES FOR YOUR DATES</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { open: 0 };
}
renderVals() {
const colors = ['#C8F25A', '#7CC8FF', '#FF8FC7'];
const data = [
{ label: 'DAY 1', area: '애월 · 협재', summary: '공항 → 모래놀이 → 카페 → 저녁 · 5곳', stops: [{ t: '10:30', n: '제주공항' }, { t: '12:00', n: '[식당명] 애월' }, { t: '13:30', n: '협재해수욕장' }, { t: '16:00', n: '[카페명] 한림' }, { t: '18:00', n: '[식당명] 한림' }] },
{ label: 'DAY 2', area: '한림 · 귀덕', summary: '체험 → 낮잠 이동 → 실내 놀이 · 5곳', stops: [{ t: '10:00', n: '[볼거리] 한림' }, { t: '12:30', n: '[식당명] 귀덕' }, { t: '14:30', n: '[실내 놀이] 제주시' }] },
{ label: 'DAY 3', area: '애월', summary: '해안 산책 → 점심 → 공항 · 4곳', stops: [{ t: '10:00', n: '[볼거리] 애월' }, { t: '12:00', n: '[식당명] 애월' }, { t: '16:40', n: '제주공항' }] }
];
const days = data.map((d, i) => {
const open = this.state.open === i;
return { ...d, open, arrow: open ? '−' : '+',
badge: 'height: 26px; border-radius: 4px; background: ' + colors[i] + '; color: #0F1417; font-family: \'IBM Plex Mono\', monospace; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center',
toggle: () => this.setState({ open: open ? -1 : i }) };
});
return { days };
}
}
</script>
</body>
</html>
