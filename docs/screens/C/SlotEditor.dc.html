<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>C 루트 짜기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8F25A}a:hover{color:#EEF2F3}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Gothic A1', sans-serif; color: #EEF2F3; background: #0F1417; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 6px; padding: 16px 12px 6px">
    <a href="C_TripSetup.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EEF2F3" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <div style="font-size: 16px; font-weight: 800">제주 서쪽 2박 3일</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #9AA8B0">KIDS 7Y·3Y · 11.06–11.08</div>
    </div>
  </header>
  <nav aria-label="일자" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 8px 20px 0; border: 1px solid #2A343C; border-radius: 10px; overflow: hidden">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="3">
      <button onClick="{{d.pick}}" style="{{d.style}}">{{d.label}}</button>
    </sc-for>
  </nav>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px 20px">
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #9AA8B0">FILLED</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600">{{filled}}</span></div>
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #9AA8B0">DRIVE</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600">{{drive}}</span></div>
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #9AA8B0">ALERT</span><span style="{{alertStyle}}">{{alerts}}</span></div>
  </div>
  <main style="flex: 1; overflow-y: auto; padding: 0 20px 16px; display: flex; flex-direction: column; border-top: 1px solid #2A343C">
    <sc-for list="{{slots}}" as="s" hint-placeholder-count="8">
      <sc-if value="{{s.isTravel}}" hint-placeholder-val="{{ false }}">
        <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; align-items: center; padding: 4px 0">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #7CC8FF; text-align: right">{{s.dur}}</span>
          <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #9AA8B0"><span style="width: 1px; height: 18px; background: #7CC8FF"></span>{{s.text}}</span>
        </div>
      </sc-if>
      <sc-if value="{{s.isSlot}}" hint-placeholder-val="{{ true }}">
        <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; align-items: stretch; padding: 6px 0">
          <div style="display: flex; flex-direction: column; align-items: flex-end; padding-top: 12px">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600">{{s.time}}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #9AA8B0">{{s.code}}</span>
          </div>
          <sc-if value="{{s.isEmpty}}" hint-placeholder-val="{{ false }}">
            <a href="C_PlacePicker.dc.html" style="display: flex; align-items: center; justify-content: space-between; padding: 14px; border-radius: 12px; border: 1px dashed #5A6871; text-decoration: none; color: #9AA8B0; font-size: 14px">{{s.name}}<span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; color: #C8F25A">+</span></a>
          </sc-if>
          <sc-if value="{{s.isFilled}}" hint-placeholder-val="{{ true }}">
            <a href="C_PlacePicker.dc.html" style="{{s.card}}">
              <span style="display: flex; justify-content: space-between; gap: 8px">
                <span style="font-size: 15px; font-weight: 600">{{s.name}}</span>
                <span style="{{s.statusStyle}}">{{s.status}}</span>
              </span>
              <span style="font-size: 12px; color: #9AA8B0">{{s.meta}}</span>
              <sc-if value="{{s.warn}}" hint-placeholder-val="{{ false }}">
                <span style="font-size: 12px; font-weight: 600; color: #FF9A76">{{s.warn}}</span>
              </sc-if>
            </a>
          </sc-if>
          <sc-if value="{{s.isFixed}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 12px; background: #182026">
              <span style="font-size: 14px; font-weight: 600">{{s.name}}</span>
              <span style="font-size: 12px; color: #9AA8B0">{{s.meta}}</span>
            </div>
          </sc-if>
        </div>
      </sc-if>
    </sc-for>
  </main>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 12px 20px 24px; border-top: 1px solid #2A343C">
    <button style="height: 52px; border-radius: 12px; border: 1px solid #EEF2F3; background: transparent; font: inherit; font-size: 14px; font-weight: 800; color: #EEF2F3; cursor: pointer">AI 빈칸 채우기</button>
    <a href="C_RouteResult.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: #C8F25A; color: #0F1417; font-weight: 800; font-size: 14px; text-decoration: none">루트 계산</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { day: 0 };
}
renderVals() {
const F = (time, code, name, meta, warn) => ({ isSlot: true, isFilled: true, time, code, name, meta, warn: warn || '' });
const E = (time, code, name) => ({ isSlot: true, isEmpty: true, time, code, name });
const X = (time, code, name, meta) => ({ isSlot: true, isFixed: true, time, code, name, meta });
const T = (dur, text) => ({ isTravel: true, dur, text });
const plans = [
[X('10:30', 'ARR', '제주공항', '렌터카 수령 40M'), T('+45M', '차량 · 낮잠 구간'), F('12:00', 'LUNCH', '[식당명] 애월', '아기의자 · 주차'), T('+15M', '차량'),
F('13:30', 'PM', '협재해수욕장', '발 씻는 곳 · 유모차'), T('+08M', '차량'), F('16:00', 'CAFE', '[카페명] 한림', '키즈존', '금요일 정기휴무 — 교체 필요'), E('18:00', 'DINNER', '저녁 장소 선택'), X('20:00', 'STAY', '[숙소명] 애월', '체크인')],
[X('09:30', 'STAY', '[숙소명] 애월', '출발'), E('10:00', 'AM', '오전 볼거리 선택'), E('12:00', 'LUNCH', '점심 장소 선택'), E('14:00', 'PM', '오후 볼거리 선택'), E('18:00', 'DINNER', '저녁 장소 선택')],
[X('09:30', 'OUT', '[숙소명] 애월', '체크아웃'), E('10:00', 'AM', '오전 볼거리 선택'), E('12:00', 'LUNCH', '점심 장소 선택'), X('16:40', 'DEP', '제주공항', '18:40 출발 · 렌터카 반납')]
];
const d = this.state.day;
const days = ['DAY 1 · 11.06', 'DAY 2 · 11.07', 'DAY 3 · 11.08'].map((l, i) => ({ label: l,
style: 'height: 44px; border: none; font-family: \'IBM Plex Mono\', monospace; font-size: 12px; cursor: pointer; ' + (d === i ? 'background: #EEF2F3; color: #0F1417; font-weight: 600' : 'background: transparent; color: #9AA8B0'),
pick: () => this.setState({ day: i }) }));
const slots = plans[d].map((s) => s.isFilled ? ({ ...s,
status: s.warn ? 'CHECK' : 'OK',
statusStyle: 'flex: none; font-family: \'IBM Plex Mono\', monospace; font-size: 11px; font-weight: 600; ' + (s.warn ? 'color: #FF9A76' : 'color: #C8F25A'),
card: 'display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 12px; text-decoration: none; color: #EEF2F3; background: #182026; ' + (s.warn ? 'border: 1px solid #FF9A76' : 'border: 1px solid #2A343C') }) : s);
const all = plans[d].filter((s) => s.isSlot && !s.isFixed);
const filledN = all.filter((s) => s.isFilled).length;
const alertsN = all.filter((s) => s.warn).length;
const drive = ['1H08M', '—', '—'][d];
return { days, slots, filled: filledN + '/' + all.length, drive, alerts: String(alertsN),
alertStyle: 'font-family: \'IBM Plex Mono\', monospace; font-size: 18px; font-weight: 600; color: ' + (alertsN ? '#FF9A76' : '#EEF2F3') };
}
}
</script>
</body>
</html>
