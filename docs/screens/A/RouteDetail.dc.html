<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>S06 공개 루트 상세</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6F6A}a:hover{color:#17312B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'IBM Plex Sans KR', sans-serif; color: #17312B; background: #F6F8F7; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; padding: 16px 12px 4px">
    <a href="Main.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17312B" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <button aria-label="링크 공유" style="margin-left: auto; width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17312B" stroke-width="2" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 13v7h14v-7"></path></svg>
    </button>
    <button aria-label="저장" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17312B" stroke-width="2" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>
    </button>
  </header>
  <main style="flex: 1; overflow-y: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 18px">
    <section style="display: flex; flex-direction: column; gap: 10px">
      <h1 style="margin: 0; font-size: 22px; line-height: 1.35; font-weight: 700">제주 서쪽 2박 3일,<br>해변 모래놀이 코스</h1>
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="width: 36px; height: 36px; border-radius: 18px; background: #17312B; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">[작]</div>
        <div style="display: flex; flex-direction: column">
          <span style="font-size: 14px; font-weight: 600">[작성자 닉네임]</span>
          <span style="font-size: 12px; color: #4A615B">아이 2명 (5세, 2세)과 · 2026년 8월 다녀옴</span>
        </div>
      </div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <span style="font-size: 12px; padding: 4px 8px; border-radius: 6px; background: #FDEBD3; color: #7A4508">아기의자 있는 식당</span>
        <span style="font-size: 12px; padding: 4px 8px; border-radius: 6px; background: #FDEBD3; color: #7A4508">이동 중 낮잠</span>
        <span style="font-size: 12px; padding: 4px 8px; border-radius: 6px; background: #FDEBD3; color: #7A4508">발 씻는 곳</span>
      </div>
    </section>

    <section aria-label="루트 요약" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DCE5E2">
        <span style="font-size: 12px; color: #4A615B">장소</span><span style="font-size: 17px; font-weight: 700">14곳</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DCE5E2">
        <span style="font-size: 12px; color: #4A615B">총 이동</span><span style="font-size: 17px; font-weight: 700">3시간 10분</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DCE5E2">
        <span style="font-size: 12px; color: #4A615B">복사</span><span style="font-size: 17px; font-weight: 700">[N]회</span>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700">일자별 루트</h2>
      <sc-for list="{{days}}" as="d" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #DCE5E2">
          <button onClick="{{d.toggle}}" aria-expanded="{{d.open}}" style="display: flex; align-items: center; gap: 8px; padding: 0; border: none; background: transparent; font: inherit; color: #17312B; cursor: pointer; text-align: left; min-height: 32px">
            <span style="{{d.dot}}"></span>
            <span style="font-size: 15px; font-weight: 700">{{d.label}}</span>
            <span style="font-size: 12px; color: #4A615B">{{d.area}}</span>
            <span style="margin-left: auto; font-size: 13px; color: #1F6F6A; font-weight: 600">{{d.more}}</span>
          </button>
          <div style="font-size: 13px; color: #4A615B; line-height: 1.5">{{d.summary}}</div>
          <sc-if value="{{d.open}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 6px; border-top: 1px solid #EEF2F1">
              <sc-for list="{{d.stops}}" as="s" hint-placeholder-count="4">
                <div style="display: flex; gap: 10px; font-size: 13px">
                  <span style="flex: none; width: 40px; font-weight: 700">{{s.t}}</span>
                  <span style="flex: 1">{{s.n}}</span>
                  <a href="https://map.kakao.com" style="font-size: 12px">지도</a>
                </div>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </section>

    <section style="display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 14px; background: #E6EEEC">
      <div style="font-size: 14px; font-weight: 700">작성자 팁</div>
      <div style="font-size: 13px; line-height: 1.55; color: #2C463F">[작성자가 남긴 메모. 예: 협재는 오후 물때가 좋아요, 둘째 날 비 오면 실내 코스로 바꿨어요.]</div>
    </section>

    <button style="align-self: flex-start; height: 40px; padding: 0; border: none; background: transparent; font: inherit; font-size: 13px; color: #4A615B; text-decoration: underline; cursor: pointer">장소 정보가 달라졌나요? 제보하기</button>
  </main>
  <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 20px 24px; background: #FFFFFF; border-top: 1px solid #DCE5E2">
    <a href="SlotEditor.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 14px; background: #F2A33A; color: #17312B; font-weight: 700; font-size: 16px; text-decoration: none">
      내 일정으로 복사
      <span style="font-size: 11px; padding: 3px 7px; border-radius: 6px; background: #17312B; color: #FFFFFF; font-weight: 600">프리미엄</span>
    </a>
    <div style="font-size: 12px; color: #4A615B; text-align: center">복사하면 내 날짜·숙소 기준으로 휴무와 이동시간을 다시 확인해요</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { open: 0 };
}
renderVals() {
const colors = ['#1F6F6A', '#C4661A', '#3D5BA9'];
const data = [
{ label: '1일차', area: '애월 · 협재', summary: '공항 → 점심 → 협재 모래놀이 → 카페 → 저녁 (5곳)',
stops: [{ t: '10:30', n: '제주공항' }, { t: '12:00', n: '[식당명] 애월' }, { t: '13:30', n: '협재해수욕장' }, { t: '16:00', n: '[카페명] 한림' }, { t: '18:00', n: '[식당명] 한림' }] },
{ label: '2일차', area: '한림 · 귀덕', summary: '오전 체험 → 점심 → 낮잠 이동 → 실내 놀이 → 저녁 (5곳)',
stops: [{ t: '10:00', n: '[볼거리] 한림' }, { t: '12:30', n: '[식당명] 귀덕' }, { t: '14:30', n: '[실내 놀이] 제주시' }] },
{ label: '3일차', area: '애월', summary: '체크아웃 → 해안 산책 → 점심 → 공항 (4곳)',
stops: [{ t: '10:00', n: '[볼거리] 애월' }, { t: '12:00', n: '[식당명] 애월' }, { t: '16:40', n: '제주공항' }] }
];
const days = data.map((d, i) => {
const open = this.state.open === i;
return { ...d, open, more: open ? '접기' : '펼치기',
dot: 'flex: none; width: 10px; height: 10px; border-radius: 5px; background: ' + colors[i],
toggle: () => this.setState({ open: open ? -1 : i }) };
});
return { days };
}
}
</script>
</body>
</html>
