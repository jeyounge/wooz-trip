<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>S04 장소 선택</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6F6A}a:hover{color:#17312B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'IBM Plex Sans KR', sans-serif; color: #17312B; background: #3B4A46; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">
  <a href="SlotEditor.dc.html" aria-label="닫고 루트 짜기로 돌아가기" style="flex: none; height: 92px; display: block"></a>
  <section aria-label="장소 선택" style="flex: 1; min-height: 0; display: flex; flex-direction: column; background: #FFFFFF; border-radius: 24px 24px 0 0">
    <div style="display: flex; justify-content: center; padding: 10px 0 4px">
      <div style="width: 40px; height: 4px; border-radius: 2px; background: #C9D6D2"></div>
    </div>
    <div style="display: flex; align-items: flex-start; padding: 8px 20px 12px; gap: 8px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 18px; font-weight: 700">1일차 저녁 · 18:00</div>
        <div style="font-size: 13px; color: #4A615B">앞 장소 [카페명] 한림에서 가까운 순</div>
      </div>
      <a href="SlotEditor.dc.html" aria-label="닫기" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17312B" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>
    <div style="padding: 0 20px 10px">
      <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 12px; background: #F6F8F7">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A615B" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <input type="search" aria-label="장소 이름 검색" placeholder="장소 이름으로 찾기" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: inherit; font-size: 14px; color: #17312B">
      </label>
    </div>
    <div style="display: flex; gap: 6px; padding: 0 20px 12px; overflow-x: auto; flex: none">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
        <button onClick="{{f.toggle}}" aria-pressed="{{f.on}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
    <div style="padding: 0 20px 8px; font-size: 12px; color: #4A615B; border-bottom: 1px solid #DCE5E2">{{countText}}</div>
    <div style="flex: 1; overflow-y: auto; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{places}}" as="p" hint-placeholder-count="4">
        <div style="{{p.cardStyle}}">
          <div style="display: flex; gap: 12px">
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <div style="font-size: 15px; font-weight: 700">{{p.name}}</div>
              <div style="font-size: 12px; color: #4A615B">{{p.meta}}</div>
              <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px">
                <sc-for list="{{p.tags}}" as="t" hint-placeholder-count="2">
                  <span style="font-size: 11px; padding: 3px 7px; border-radius: 6px; background: #FDEBD3; color: #7A4508">{{t}}</span>
                </sc-for>
              </div>
            </div>
            <div style="flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
              <span style="font-size: 13px; font-weight: 700; color: #1F6F6A">{{p.dist}}</span>
              <sc-if value="{{p.ok}}" hint-placeholder-val="{{ true }}">
                <a href="SlotEditor.dc.html" style="display: flex; align-items: center; justify-content: center; height: 36px; padding: 0 14px; border-radius: 10px; background: #17312B; color: #FFFFFF; font-size: 13px; font-weight: 700; text-decoration: none">선택</a>
              </sc-if>
            </div>
          </div>
          <sc-if value="{{p.warn}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px; background: #FBE3E0; color: #8E2A1E; font-size: 12px; font-weight: 600">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8E2A1E" stroke-width="2.2" aria-hidden="true"><path d="M12 3l10 18H2zM12 10v5M12 18v.5"></path></svg>
              {{p.warn}}
            </div>
          </sc-if>
          <div style="display: flex; gap: 14px; font-size: 12px">
            <a href="https://map.kakao.com" style="text-decoration: underline">카카오맵에서 사진·리뷰</a>
            <a href="https://search.naver.com" style="text-decoration: underline">블로그 후기</a>
            <button style="margin-left: auto; border: none; background: transparent; padding: 0; font: inherit; font-size: 12px; color: #4A615B; cursor: pointer">정보 제보</button>
          </div>
        </div>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { on: { '아기의자': true } };
}
renderVals() {
const on = this.state.on;
const labels = ['아기의자', '유아 메뉴', '주차', '유모차 가능', '수유실', '좌식'];
const filters = labels.map((l) => ({
label: l, on: !!on[l],
style: 'flex: none; height: 36px; padding: 0 12px; border-radius: 18px; font: inherit; font-size: 13px; cursor: pointer; ' +
(on[l] ? 'border: 1.5px solid #17312B; background: #17312B; color: #FFFFFF; font-weight: 600' : 'border: 1.5px solid #C9D6D2; background: #FFFFFF; color: #17312B'),
toggle: () => this.setState({ on: { ...on, [l]: !on[l] } })
}));
const all = [
{ name: '[식당명 A] 한림', meta: '고기국수 · 영업 10:00–21:00', dist: '차로 4분', tags: ['아기의자', '유아 메뉴', '주차'] },
{ name: '[식당명 B] 협재', meta: '해산물 · 영업 11:00–20:30', dist: '차로 7분', tags: ['아기의자', '좌식', '주차'] },
{ name: '[식당명 C] 금능', meta: '돈가스 · 영업 11:30–19:30 (라스트오더 19:00)', dist: '차로 9분', tags: ['아기의자', '유아 메뉴', '유모차 가능'], warn: '도착 18:15 기준 이용 가능 시간이 45분이에요' },
{ name: '[식당명 D] 한림', meta: '흑돼지 · 금요일 정기휴무', dist: '차로 5분', tags: ['아기의자', '주차', '수유실'], warn: '11.6(금)은 정기휴무예요', closed: true },
{ name: '[식당명 E] 귀덕', meta: '한식 뷔페 · 영업 11:00–20:00', dist: '차로 12분', tags: ['유아 메뉴', '주차', '수유실'] }
];
const need = labels.filter((l) => on[l]);
const places = all.filter((p) => need.every((n) => p.tags.indexOf(n) >= 0)).map((p) => ({
...p, warn: p.warn || '', ok: !p.closed,
cardStyle: 'display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; border: 1px solid #DCE5E2; ' + (p.closed ? 'background: #F2F4F3; opacity: 0.75' : 'background: #FFFFFF')
}));
return { filters, places, countText: '조건에 맞는 곳 ' + places.length + '곳 · 검수된 장소만 보여요' };
}
}
</script>
</body>
</html>
